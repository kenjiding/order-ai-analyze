services:
  warehouse-server:
    build:
      context: .
      dockerfile: Containerfile
    image: warehouse-server:latest
    container_name: warehouse-server
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
