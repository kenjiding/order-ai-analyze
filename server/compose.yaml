services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    mem_limit: 4g
    command: postgres -c shared_buffers=1GB -c effective_cache_size=3GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  warehouse-server:
    build:
      # 需包含 ../shared（前后端共用 rankingScore 等）
      context: ..
      dockerfile: server/Containerfile
    image: warehouse-server:latest
    container_name: warehouse-server
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@postgres:5432/${POSTGRES_DB:-warehouse}
      JOB_ARTIFACT_DIR: /data/job-artifacts
      # 与 mem_limit 分层：堆内存设软上限，命中时是可控的 JS 堆溢出崩溃（有日志/堆栈），
      # 而不是被内核 OOM killer 无预警地强杀整个进程、殃及同机其它容器
      NODE_OPTIONS: --max-old-space-size=1536
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8787/health | grep -q "\"ok\":true"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - job_artifacts:/data/job-artifacts

  warehouse-worker:
    build:
      context: ..
      dockerfile: server/Containerfile
    image: warehouse-server:latest
    container_name: warehouse-worker
    restart: unless-stopped
    mem_limit: 8g
    depends_on:
      postgres:
        condition: service_healthy
      warehouse-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@postgres:5432/${POSTGRES_DB:-warehouse}
      JOB_ARTIFACT_DIR: /data/job-artifacts
      NODE_OPTIONS: --max-old-space-size=3072
    command: ['sh', '-c', 'pnpm worker:start']
    volumes:
      - job_artifacts:/data/job-artifacts

volumes:
  postgres_data:
  job_artifacts:
