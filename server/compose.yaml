services:
  postgres:
    profiles: [stack]
    image: docker.io/library/postgres:16-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  warehouse-server:
    profiles: [stack]
    build:
      context: .
      dockerfile: Containerfile
    image: warehouse-server:latest
    container_name: warehouse-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@postgres:5432/${POSTGRES_DB:-warehouse}
      JOB_ARTIFACT_DIR: /data/job-artifacts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - job_artifacts:/data/job-artifacts

  warehouse-worker:
    profiles: [stack]
    build:
      context: .
      dockerfile: Containerfile
    image: warehouse-server:latest
    container_name: warehouse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:-warehouse}@postgres:5432/${POSTGRES_DB:-warehouse}
      JOB_ARTIFACT_DIR: /data/job-artifacts
    command: ['sh', '-c', 'pnpm db:migrate && pnpm worker:start']
    volumes:
      - job_artifacts:/data/job-artifacts

volumes:
  postgres_data:
  job_artifacts:
