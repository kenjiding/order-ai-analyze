<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>仓库 3D 示意图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#ui {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(20,20,40,0.85); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
  padding: 10px 20px; color: #fff; font-size: 13px; text-align: center;
  pointer-events: none; z-index: 10;
}
#ui span { color: #aaa; }
#controls {
  position: fixed; bottom: 16px; right: 16px;
  background: rgba(20,20,40,0.85); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
  padding: 12px 16px; color: #aaa; font-size: 12px; z-index: 10;
  line-height: 2;
}
#snapshot {
  position: fixed; top: 16px; left: 16px; z-index: 11;
  cursor: pointer; pointer-events: auto;
  background: rgba(30,90,70,0.92); color: #d8ffee;
  border: 1px solid rgba(120,255,200,0.4); border-radius: 10px;
  padding: 8px 14px; font-size: 13px; font-family: inherit;
}
#snapshot:hover { background: rgba(45,120,95,0.98); }
</style>
</head>
<body>
<button type="button" id="snapshot" title="导出当前视角为 PNG 图片">Save PNG</button>
<div id="ui">Adelaide 仓库 3D 示意图 &nbsp;|&nbsp; <span>左键旋转 · 滚轮缩放 · 右键平移</span></div>
<div id="controls">🖱 左键拖拽旋转<br>🔍 滚轮缩放<br>✋ 右键平移</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = 'none';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 55, 120);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 200);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 0.9);
dir.position.set(12, 22, 12);
dir.castShadow = true;
dir.shadow.mapSize.width = dir.shadow.mapSize.height = 2048;
Object.assign(dir.shadow.camera, { left:-30,right:30,top:30,bottom:-30,near:0.1,far:100 });
scene.add(dir);
const fill = new THREE.DirectionalLight(0x8899ff, 0.3);
fill.position.set(-10, 6, -5);
scene.add(fill);

// ─── helpers ──────────────────────────────────────────────
function box(w,h,d,color,x,y,z,op){
  op = op === undefined ? 1 : op;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({color, transparent:op<1, opacity:op})
  );
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
function boxOn(parent, w,h,d,color,x,y,z, op){
  op = op === undefined ? 1 : op;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({color, transparent:op<1, opacity:op})
  );
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cylinder(r,h,color,x,y,z){
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,20),
    new THREE.MeshLambertMaterial({color})
  );
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
}
function warningCone(x,z,sc){
  sc = sc || 1;
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22*sc,0.28*sc,0.10*sc,18),
    new THREE.MeshLambertMaterial({color:0x222222})
  );
  base.position.set(x,0.05*sc,z);
  base.castShadow = base.receiveShadow = true;
  scene.add(base);
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08*sc,0.19*sc,0.90*sc,18),
    new THREE.MeshLambertMaterial({color:0xff7a1a})
  );
  body.position.set(x,0.55*sc,z);
  body.castShadow = body.receiveShadow = true;
  scene.add(body);
  const stripe = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11*sc,0.15*sc,0.14*sc,18),
    new THREE.MeshLambertMaterial({color:0xfff2c6})
  );
  stripe.position.set(x,0.63*sc,z);
  stripe.castShadow = stripe.receiveShadow = true;
  scene.add(stripe);
}
var warningTapeStripeTexture = null;
function getWarningTapeStripeTexture(){
  if(warningTapeStripeTexture) return warningTapeStripeTexture;
  var cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 160;
  var ctx = cv.getContext('2d');
  // yellow base
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(0,0,cv.width,cv.height);
  // wide diagonal black stripes
  ctx.save();
  ctx.translate(-260, 0);
  ctx.rotate(-Math.PI / 6);
  for(var i=0;i<16;i++){
    ctx.fillStyle = '#111111';
    ctx.fillRect(i*180, -240, 92, 640);
  }
  ctx.restore();
  // subtle glossy highlight for tape-like feel
  var g = ctx.createLinearGradient(0, 0, 0, cv.height);
  g.addColorStop(0.00, 'rgba(255,255,255,0.28)');
  g.addColorStop(0.26, 'rgba(255,255,255,0.00)');
  g.addColorStop(0.74, 'rgba(0,0,0,0.00)');
  g.addColorStop(1.00, 'rgba(0,0,0,0.26)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cv.width, cv.height);
  var tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = 8;
  warningTapeStripeTexture = tex;
  return tex;
}
function warningTape(x1,z1,x2,z2,y,color){
  var dx=x2-x1, dz=z2-z1;
  var len=Math.sqrt(dx*dx+dz*dz);
  if(len<=0.001)return;
  var map = getWarningTapeStripeTexture().clone();
  map.needsUpdate = true;
  map.repeat.set(Math.max(1, len / 1.45), 1);
  var tape = new THREE.Mesh(
    new THREE.PlaneGeometry(len, 0.26),
    new THREE.MeshLambertMaterial({
      color:color||0xffffff,
      map: map,
      side: THREE.DoubleSide
    })
  );
  tape.position.set((x1+x2)/2,y,(z1+z2)/2);
  tape.rotation.y = -Math.atan2(dz, dx);
  tape.castShadow = tape.receiveShadow = true;
  scene.add(tape);
}
var labelFlashMaterials = [];
function label(text,x,y,z,color,size, flash){
  color = color || '#ffffff'; size = size || 0.35;
  var pad = 40, ch = 128, maxCW = 1536;
  var fontPx = Math.max(11, Math.floor(size * 168));
  var cv = document.createElement('canvas');
  var ctx = cv.getContext('2d');
  function measure(){
    ctx.font = 'bold ' + fontPx + 'px Segoe UI,Arial';
    return ctx.measureText(text).width;
  }
  var tw = measure();
  while (tw + pad > maxCW && fontPx > 10) {
    fontPx--;
    tw = measure();
  }
  cv.width = Math.min(maxCW, Math.max(512, Math.ceil(tw + pad)));
  cv.height = ch;
  ctx.fillStyle = color;
  ctx.font = 'bold ' + fontPx + 'px Segoe UI,Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cv.width / 2, ch / 2);
  var tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  var mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, opacity: 1
  });
  if (flash) labelFlashMaterials.push(mat);
  var sp = new THREE.Sprite(mat);
  sp.position.set(x, y, z);
  sp.scale.set(size * 6 * (cv.width / 512), size * 2.2, 1);
  scene.add(sp);
}
function placeSvgLogoLabel(filePath,x,y,z,size,fallbackText){
  var sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    transparent: true, depthTest: false
  }));
  sprite.position.set(x,y,z);
  sprite.scale.set(size * 7.2, size * 2.2, 1);
  scene.add(sprite);
  var url = String(filePath || '').replace(/\\/g, '/');
  if (/^[a-zA-Z]+:\/\//.test(url)) {
    // keep absolute URL as-is
  } else if (url.charAt(0) === '/') {
    url = 'file://' + url;
  }
  try { url = encodeURI(url); } catch (e) {}
  new THREE.TextureLoader().load(
    url,
    function(tex){
      var img = tex.image;
      if (img && img.width && img.height) {
        // 先高分辨率栅格化 SVG，再贴图，减少失真
        var upscale = 4;
        var maxSide = 4096;
        var tw = Math.min(maxSide, Math.max(1024, Math.round(img.width * upscale)));
        var th = Math.min(maxSide, Math.max(256, Math.round(img.height * upscale)));
        var hi = document.createElement('canvas');
        hi.width = tw; hi.height = th;
        var hctx = hi.getContext('2d');
        hctx.imageSmoothingEnabled = true;
        hctx.imageSmoothingQuality = 'high';
        hctx.clearRect(0, 0, tw, th);
        hctx.drawImage(img, 0, 0, tw, th);

        var hiTex = new THREE.CanvasTexture(hi);
        hiTex.generateMipmaps = true;
        hiTex.minFilter = THREE.LinearMipmapLinearFilter;
        hiTex.magFilter = THREE.LinearFilter;
        hiTex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
        hiTex.needsUpdate = true;
        sprite.material.map = hiTex;
        sprite.material.needsUpdate = true;

        // 按你的要求：logo 展示缩小 3 倍
        var ratio = tw / th;
        var h = (size * 2.4) / 3;
        sprite.scale.set(h * ratio, h, 1);
        tex.dispose();
      } else {
        tex.needsUpdate = true;
        tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
        sprite.material.map = tex;
        sprite.material.needsUpdate = true;
        sprite.scale.set((size * 2.4) / 3, (size * 2.4) / 3, 1);
      }
    },
    undefined,
    function(){
      scene.remove(sprite);
      label(fallbackText || 'Imile ADL', x, y, z, '#3e59f1', size);
    }
  );
}
function doorFrame(w,h,thick,color,x,y,z,rotY){
  rotY = rotY || 0;
  const mat = new THREE.MeshLambertMaterial({color});
  const g = new THREE.Group();
  const lp = new THREE.Mesh(new THREE.BoxGeometry(thick,h,thick),mat);
  lp.position.set(-w/2+thick/2, h/2, 0); g.add(lp);
  const rp = new THREE.Mesh(new THREE.BoxGeometry(thick,h,thick),mat);
  rp.position.set(w/2-thick/2, h/2, 0); g.add(rp);
  const tb = new THREE.Mesh(new THREE.BoxGeometry(w,thick,thick),mat);
  tb.position.set(0, h-thick/2, 0); g.add(tb);
  g.position.set(x,y,z); g.rotation.y = rotY;
  scene.add(g);
}
function doorPanel(w,h,color,x,y,z,rotY){
  rotY = rotY || 0;
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,0.07),
    new THREE.MeshLambertMaterial({color,transparent:true,opacity:0.28,side:THREE.DoubleSide})
  );
  m.position.set(x,y,z); m.rotation.y = rotY; scene.add(m);
}
function floorZone(w,d,color,x,z,txt,tcol){
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w,d),
    new THREE.MeshLambertMaterial({color,transparent:true,opacity:0.3,side:THREE.DoubleSide})
  );
  m.rotation.x = -Math.PI/2; m.position.set(x,0.02,z); scene.add(m);
  const el = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(w,d)),
    new THREE.LineBasicMaterial({color,transparent:true,opacity:0.85})
  );
  el.rotation.x = -Math.PI/2; el.position.set(x,0.03,z); scene.add(el);
  if(txt) label(txt, x, 0.5, z, tcol||'#ffffff', 0.28);
}
/** Cage Returns：浅红底 + 外框与区内网格均为红色虚线 */
function floorZoneDashedRed(w,d,x,z,txt,tcol){
  var hw=w/2, hd=d/2;
  var tint=new THREE.Mesh(
    new THREE.PlaneGeometry(w,d),
    new THREE.MeshLambertMaterial({color:0xff3344,transparent:true,opacity:0.1,side:THREE.DoubleSide})
  );
  tint.rotation.x=-Math.PI/2; tint.position.set(x,0.02,z); tint.receiveShadow=true; scene.add(tint);
  var dashMat=new THREE.LineDashedMaterial({
    color:0xff2222, dashSize:0.38, gapSize:0.26, transparent:true, opacity:0.92
  });
  var borderPts=[
    new THREE.Vector3(-hw,0,-hd), new THREE.Vector3(hw,0,-hd),
    new THREE.Vector3(hw,0,hd), new THREE.Vector3(-hw,0,hd), new THREE.Vector3(-hw,0,-hd)
  ];
  var border=new THREE.Line(new THREE.BufferGeometry().setFromPoints(borderPts), dashMat);
  border.position.set(x,0.035,z);
  border.computeLineDistances();
  scene.add(border);
  var inner=new THREE.Group();
  inner.position.set(x,0.035,z);
  function innerSeg(x0,z0,x1,z1){
    var gg=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x0,0,z0), new THREE.Vector3(x1,0,z1)
    ]);
    var ln=new THREE.Line(gg, dashMat);
    ln.computeLineDistances();
    inner.add(ln);
  }
  var stepZ=2;
  for(var zz=-hd+stepZ; zz<hd-0.001; zz+=stepZ){ innerSeg(-hw,zz, hw,zz); }
  var stepX=w/4;
  for(var xx=-hw+stepX; xx<hw-0.001; xx+=stepX){ innerSeg(xx,-hd, xx,hd); }
  scene.add(inner);
  if(txt) label(txt,x,0.5,z,tcol||'#ffffff',0.28);
}
/** 地面动态箭头贴图（Canvas） */
function createGroundFlowTexture(fill, stroke, glow){
  var w = 512, h = 512;
  var cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  var ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  function chevron(cx, cy, s){
    ctx.beginPath();
    ctx.moveTo(cx, cy - 94 * s);
    ctx.lineTo(cx - 82 * s, cy + 16 * s);
    ctx.lineTo(cx - 34 * s, cy + 16 * s);
    ctx.lineTo(cx, cy - 34 * s);
    ctx.lineTo(cx + 34 * s, cy + 16 * s);
    ctx.lineTo(cx + 82 * s, cy + 16 * s);
    ctx.closePath();
  }
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 11;
  ctx.fillStyle = fill;
  ctx.shadowColor = glow;
  ctx.shadowBlur = 20;
  // 单贴图只放一个箭头，避免减小间距后箭头相互视觉叠压
  chevron(w * 0.5, h * 0.54, 1.08); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  var tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  tex.anisotropy = 8;
  return tex;
}

// ─── cage cart (笼车) ─────────────────────────────────────
function cageCart(x,y,z,sc,col,optLoaded){
  sc = sc||1; col = col||0x99aacc;
  const g = new THREE.Group();
  const cw=1.0*sc, cd=0.7*sc, ch=1.6*sc, wt=0.05*sc;
  const mat = new THREE.MeshLambertMaterial({color:col});
  // corner posts
  [[cw/2-wt/2,ch/2,cd/2-wt/2],[-(cw/2-wt/2),ch/2,cd/2-wt/2],
   [cw/2-wt/2,ch/2,-(cd/2-wt/2)],[-(cw/2-wt/2),ch/2,-(cd/2-wt/2)]].forEach(function(p){
    const pm = new THREE.Mesh(new THREE.BoxGeometry(wt,ch,wt),mat);
    pm.position.set(p[0],p[1],p[2]); g.add(pm);
  });
  // rails
  [0.08*sc, ch*0.45, ch-wt/2].forEach(function(ry){
    [cd/2-wt/2, -(cd/2-wt/2)].forEach(function(rz){
      const r = new THREE.Mesh(new THREE.BoxGeometry(cw,wt,wt),mat);
      r.position.set(0,ry,rz); g.add(r);
    });
    [cw/2-wt/2, -(cw/2-wt/2)].forEach(function(rx){
      const r = new THREE.Mesh(new THREE.BoxGeometry(wt,wt,cd),mat);
      r.position.set(rx,ry,0); g.add(r);
    });
  });
  // wire mesh sides
  const wm = new THREE.MeshLambertMaterial({color:0x8899bb,transparent:true,opacity:0.15,side:THREE.DoubleSide,wireframe:true});
  [cd/2,-cd/2].forEach(function(rz){
    const p = new THREE.Mesh(new THREE.PlaneGeometry(cw-wt*2, ch-0.08*sc-wt),wm.clone());
    p.position.set(0,(ch-0.08*sc-wt)/2+0.08*sc,rz); g.add(p);
  });
  [cw/2,-cw/2].forEach(function(rx){
    const p = new THREE.Mesh(new THREE.PlaneGeometry(cd-wt*2, ch-0.08*sc-wt),wm.clone());
    p.position.set(rx,(ch-0.08*sc-wt)/2+0.08*sc,0); p.rotation.y=Math.PI/2; g.add(p);
  });
  // base
  const base = new THREE.Mesh(new THREE.BoxGeometry(cw,0.06*sc,cd),
    new THREE.MeshLambertMaterial({color:0x445566}));
  base.position.set(0,0.03*sc,0); g.add(base);
  // wheels
  [[cw/2-0.1*sc,0,cd/2-0.1*sc],[-(cw/2-0.1*sc),0,cd/2-0.1*sc],
   [cw/2-0.1*sc,0,-(cd/2-0.1*sc)],[-(cw/2-0.1*sc),0,-(cd/2-0.1*sc)]].forEach(function(w){
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.08*sc,0.08*sc,0.06*sc,8),
      new THREE.MeshLambertMaterial({color:0x222222}));
    wh.rotation.x=Math.PI/2; wh.position.set(w[0],0.08*sc,w[2]); g.add(wh);
  });
  // parcels
  var pc=[0xe8c87a,0xd4956b,0xc8d4e8];
  for(var i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.28*sc,0.22*sc,0.22*sc),
      new THREE.MeshLambertMaterial({color:pc[i]}));
    b.position.set((i-1)*0.28*sc, 0.2*sc+0.11*sc, 0); g.add(b);
  }
  if(optLoaded){
    for(var j=0;j<3;j++){
      const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.26*sc,0.18*sc,0.20*sc),
        new THREE.MeshLambertMaterial({color:pc[(j+1)%3]}));
      b2.position.set((j-1)*0.29*sc, 0.2*sc+0.22*sc+0.09*sc, 0.04*sc); g.add(b2);
    }
    const b3 = new THREE.Mesh(new THREE.BoxGeometry(0.32*sc,0.14*sc,0.24*sc),
      new THREE.MeshLambertMaterial({color:0xb8a078}));
    b3.position.set(0, 0.2*sc+0.22*sc+0.18*sc+0.07*sc, -0.06*sc); g.add(b3);
  }
  g.position.set(x,y,z); g.castShadow=true; scene.add(g); return g;
}
/** 空笼车（无快递），原点在底座中心、贴地，用于进线动效；不加入 scene */
function buildEmptyCageCartGroup(sc, col){
  sc = sc || 1; col = col != null ? col : 0x559988;
  var g = new THREE.Group();
  var cw = 1.0 * sc, cd = 0.7 * sc, ch = 1.6 * sc, wt = 0.05 * sc;
  var mat = new THREE.MeshLambertMaterial({ color: col });
  [[cw/2-wt/2,ch/2,cd/2-wt/2],[-(cw/2-wt/2),ch/2,cd/2-wt/2],
   [cw/2-wt/2,ch/2,-(cd/2-wt/2)],[-(cw/2-wt/2),ch/2,-(cd/2-wt/2)]].forEach(function(p){
    var pm = new THREE.Mesh(new THREE.BoxGeometry(wt,ch,wt), mat);
    pm.position.set(p[0],p[1],p[2]); pm.castShadow = true; g.add(pm);
  });
  [0.08*sc, ch*0.45, ch-wt/2].forEach(function(ry){
    [cd/2-wt/2, -(cd/2-wt/2)].forEach(function(rz){
      var r = new THREE.Mesh(new THREE.BoxGeometry(cw,wt,wt), mat);
      r.position.set(0,ry,rz); r.castShadow = true; g.add(r);
    });
    [cw/2-wt/2, -(cw/2-wt/2)].forEach(function(rx){
      var r = new THREE.Mesh(new THREE.BoxGeometry(wt,wt,cd), mat);
      r.position.set(rx,ry,0); r.castShadow = true; g.add(r);
    });
  });
  var wm = new THREE.MeshLambertMaterial({color:0x8899bb,transparent:true,opacity:0.15,side:THREE.DoubleSide,wireframe:true});
  [cd/2,-cd/2].forEach(function(rz){
    var p = new THREE.Mesh(new THREE.PlaneGeometry(cw-wt*2, ch-0.08*sc-wt), wm.clone());
    p.position.set(0,(ch-0.08*sc-wt)/2+0.08*sc,rz); p.castShadow = true; g.add(p);
  });
  [cw/2,-cw/2].forEach(function(rx){
    var p = new THREE.Mesh(new THREE.PlaneGeometry(cd-wt*2, ch-0.08*sc-wt), wm.clone());
    p.position.set(rx,(ch-0.08*sc-wt)/2+0.08*sc,0); p.rotation.y=Math.PI/2; p.castShadow = true; g.add(p);
  });
  var base = new THREE.Mesh(new THREE.BoxGeometry(cw,0.06*sc,cd),
    new THREE.MeshLambertMaterial({color:0x445566}));
  base.position.set(0,0.03*sc,0); base.castShadow = true; g.add(base);
  [[cw/2-0.1*sc,0,cd/2-0.1*sc],[-(cw/2-0.1*sc),0,cd/2-0.1*sc],
   [cw/2-0.1*sc,0,-(cd/2-0.1*sc)],[-(cw/2-0.1*sc),0,-(cd/2-0.1*sc)]].forEach(function(w){
    var wh = new THREE.Mesh(new THREE.CylinderGeometry(0.08*sc,0.08*sc,0.06*sc,8),

/** 快递员（简化人形）；pushing=true 时为推车姿势（面朝 +Z）；uniformCol 默认蓝色制服 */
function buildCourierGroup(sc, pushing, uniformCol){
  sc = sc || 1;
  pushing = !!pushing;
  var g = new THREE.Group();
  var uniform = new THREE.MeshLambertMaterial({ color: uniformCol != null ? uniformCol : 0x2d6fd4 });
  var skin = new THREE.MeshLambertMaterial({ color: 0xe8c4a0 });
  var dark = new THREE.MeshLambertMaterial({ color: 0x1a2233 });
  var parcel = new THREE.MeshLambertMaterial({ color: 0xd4a04a });
  function part(geo, mat, x, y, z, rx, ry, rz){
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (rx) m.rotation.x = rx;
    if (ry) m.rotation.y = ry;
    if (rz) m.rotation.z = rz;
    m.castShadow = true;
    g.add(m);
    return m;
  }
  var legH = 0.48 * sc, torsoH = 0.44 * sc, headR = 0.13 * sc;
  var shoulderY = legH + torsoH * 0.82;
  part(new THREE.BoxGeometry(0.11*sc, legH, 0.13*sc), dark, -0.07*sc, legH/2, 0.02*sc);
  part(new THREE.BoxGeometry(0.11*sc, legH, 0.13*sc), dark, 0.07*sc, legH/2, 0.02*sc);
  part(new THREE.BoxGeometry(0.26*sc, torsoH, 0.16*sc), uniform, 0, legH + torsoH/2, pushing ? -0.04*sc : 0);
  part(new THREE.SphereGeometry(headR, 10, 10), skin, 0, legH + torsoH + headR + 0.02*sc, pushing ? -0.05*sc : 0);
  part(new THREE.BoxGeometry(0.24*sc, 0.05*sc, 0.24*sc), uniform, 0, legH + torsoH + headR*2 + 0.06*sc, 0);
  if (pushing) {
    part(new THREE.BoxGeometry(0.08*sc, 0.08*sc, 0.22*sc), dark, -0.13*sc, shoulderY, 0.14*sc);
    part(new THREE.BoxGeometry(0.08*sc, 0.08*sc, 0.22*sc), dark, 0.13*sc, shoulderY, 0.14*sc);
    part(new THREE.BoxGeometry(0.07*sc, 0.07*sc, 0.07*sc), dark, -0.13*sc, shoulderY - 0.06*sc, 0.28*sc);
    part(new THREE.BoxGeometry(0.07*sc, 0.07*sc, 0.07*sc), dark, 0.13*sc, shoulderY - 0.06*sc, 0.28*sc);
  } else {
    part(new THREE.BoxGeometry(0.18*sc, 0.14*sc, 0.12*sc), parcel, 0.16*sc, legH + torsoH*0.55, 0.12*sc);
    part(new THREE.BoxGeometry(0.07*sc, 0.07*sc, 0.07*sc), dark, -0.14*sc, legH + torsoH*0.45, -0.02*sc);
  }
  return g;
}
/** 快递员推空笼车（笼在前、人在后），原点在组合体中心投影地面 */
function buildCourierPushingCartGroup(cartSc, cartCol, courierScMul){
  cartSc = cartSc || 0.44;
  cartCol = cartCol != null ? cartCol : 0x5aa898;
  courierScMul = courierScMul || 1.62;
  var g = new THREE.Group();
  var cart = buildEmptyCageCartGroup(cartSc, cartCol);
  var cSc = cartSc * courierScMul;
  var courier = buildCourierGroup(cSc, true);
  var cd = 0.7 * cartSc;
  cart.position.set(0, 0, cd * 0.42);
  courier.position.set(0, 0, -(cd * 0.62 + 0.14 * cSc));
  g.add(cart);
  g.add(courier);
  return g;
}

// ─── ORBIT CONTROLS ──────────────────────────────────────
var dragging=false, rightBtn=false, prev={x:0,y:0};
var sph={theta:0.22,phi:0.80,r:32};
var tgt=new THREE.Vector3(0,1,0);
var autoRotateOn=true;
var autoRotateResumeAt=0;
var AUTO_ROTATE_IDLE_MS=2600;
var AUTO_ROTATE_SPEED=0.055;
var lastAnimMs=performance.now();
var touchInteracting=false;
function updateCam(){
  camera.position.x=tgt.x+sph.r*Math.sin(sph.phi)*Math.sin(sph.theta);
  camera.position.y=tgt.y+sph.r*Math.cos(sph.phi);
  camera.position.z=tgt.z+sph.r*Math.sin(sph.phi)*Math.cos(sph.theta);
  camera.lookAt(tgt);
}
function pauseAutoRotate(){
  autoRotateOn=false;
}
function scheduleAutoRotateResume(){
  autoRotateResumeAt=performance.now()+AUTO_ROTATE_IDLE_MS;
}
function onUserCameraInteract(){
  pauseAutoRotate();
}
updateCam();
renderer.domElement.addEventListener('mousedown',function(e){
  dragging=true;rightBtn=e.button===2;prev={x:e.clientX,y:e.clientY};
  onUserCameraInteract();
});
renderer.domElement.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('mouseup',function(){
  dragging=false;
  scheduleAutoRotateResume();
});
window.addEventListener('mousemove',function(e){
  if(!dragging)return;
  var dx=e.clientX-prev.x,dy=e.clientY-prev.y;
  if(rightBtn){
    var r=new THREE.Vector3();
    r.crossVectors(camera.getWorldDirection(new THREE.Vector3()),camera.up).normalize();
    tgt.addScaledVector(r,-dx*0.022);tgt.y+=dy*0.022;
  }else{
    sph.theta-=dx*0.007;
    sph.phi=Math.max(0.12,Math.min(1.45,sph.phi+dy*0.007));
  }
  prev={x:e.clientX,y:e.clientY};updateCam();
});
renderer.domElement.addEventListener('wheel',function(e){
  onUserCameraInteract();
  scheduleAutoRotateResume();
  sph.r=Math.max(8,Math.min(70,sph.r+e.deltaY*0.05));updateCam();
},{passive:true});
var lastT=null;
var pinchStartDist=0, pinchStartR=0;
function touchDist(t0,t1){
  var dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
renderer.domElement.addEventListener('touchstart',function(e){
  touchInteracting=true;
  onUserCameraInteract();
  if(e.touches.length===1){
    lastT={x:e.touches[0].clientX,y:e.touches[0].clientY};
    pinchStartDist=0;
  }else if(e.touches.length>=2){
    lastT=null;
    pinchStartDist=touchDist(e.touches[0],e.touches[1]);
    pinchStartR=sph.r;
  }
});
renderer.domElement.addEventListener('touchmove',function(e){
  e.preventDefault();
  onUserCameraInteract();
  if(e.touches.length===1&&lastT){
    var dx=e.touches[0].clientX-lastT.x,dy=e.touches[0].clientY-lastT.y;
    sph.theta-=dx*0.009;sph.phi=Math.max(0.12,Math.min(1.45,sph.phi+dy*0.009));
    lastT={x:e.touches[0].clientX,y:e.touches[0].clientY};updateCam();
  }else if(e.touches.length>=2){
    var d=touchDist(e.touches[0],e.touches[1]);
    if(pinchStartDist>0&&d>0){
      var ratio=pinchStartDist/d;
      sph.r=Math.max(8,Math.min(70,pinchStartR*ratio));
      updateCam();
    }
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',function(e){
  if(e.touches.length===1){
    lastT={x:e.touches[0].clientX,y:e.touches[0].clientY};
    pinchStartDist=0;
  }else if(e.touches.length===0){
    lastT=null;
    pinchStartDist=0;
    touchInteracting=false;
    scheduleAutoRotateResume();
  }
});
renderer.domElement.addEventListener('touchcancel',function(){
  lastT=null;
  pinchStartDist=0;
  touchInteracting=false;
  scheduleAutoRotateResume();
});
window.addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
var flowYawQ = new THREE.Quaternion();
var flowFlatQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
var flowYAxis = new THREE.Vector3(0, 1, 0);
function animate(){
  requestAnimationFrame(animate);
  var nowMs=performance.now();
  var dt=Math.min(0.05,(nowMs-lastAnimMs)/1000);
  lastAnimMs=nowMs;
  if(!autoRotateOn&&nowMs>=autoRotateResumeAt)autoRotateOn=true;
  if(autoRotateOn&&!dragging&&!touchInteracting){
    sph.theta+=AUTO_ROTATE_SPEED*dt;
    updateCam();
  }
  var g = entranceGuideArrows;
  if (g) {
    var t = performance.now() * 0.001;
    var flowSpeed = 1.05;
    var inFlowSpeed = 0.82;
    g.lanes.forEach(function(lane){
      var i, mesh, dist, u, p, tan, ang, speed;
      for (i = 0; i < lane.count; i++) {
        mesh = lane.group.children[i];
        if (lane.isInPaired) {
          var isPush = (i % 2 === 0);
          var curve = isPush ? lane.curvePush : lane.curveCourier;
          var curveLen = isPush ? lane.lengthPush : lane.lengthCourier;
          dist = (i * lane.step + t * inFlowSpeed) % lane.length;
          u = (dist % curveLen) / curveLen;
          p = curve.getPointAt(u);
          tan = curve.getTangentAt(u);
          ang = Math.atan2(tan.x, tan.z);
          var bob = Math.sin(t * 9.5 + i * 0.7) * 0.022;
          mesh.position.set(p.x, bob, p.z);
          mesh.rotation.set(0, ang, 0);
          continue;
        }
        speed = flowSpeed;
        dist = (i * lane.step + t * speed) % lane.length;
        u = dist / lane.length;
        p = lane.curve.getPointAt(u);
        tan = lane.curve.getTangentAt(u);
        ang = Math.atan2(tan.x, tan.z);
        if (lane.isCarts) {
          mesh.position.set(p.x, 0, p.z);
          mesh.rotation.set(0, ang, 0);
        } else {
          ang += Math.PI;
          mesh.position.set(p.x, 0.11, p.z);
          flowYawQ.setFromAxisAngle(flowYAxis, ang);
          mesh.quaternion.copy(flowYawQ).multiply(flowFlatQ);
        }
      }
    });
    var op = 0.82 + 0.16 * Math.sin(t * 3.2);
    var pulse = 1 + 0.035 * Math.sin(t * 4.4);
    if (g.matInGreen) g.matInGreen.opacity = op;
    if (g.matOut) g.matOut.opacity = op;
    g.lanes.forEach(function(lane){
      lane.group.children.forEach(function(m, idx){
        if (lane.isInPaired || lane.isCarts) m.scale.set(pulse, pulse, pulse);
        else m.scale.set(pulse, 1, pulse);
      });
    });
  }
  if (labelFlashMaterials.length) {
    var ft = performance.now() * 0.001;
    var flashOp = 0.28 + 0.72 * Math.abs(Math.sin(ft * 5.8));
    labelFlashMaterials.forEach(function (m) { m.opacity = flashOp; });
  }
  renderer.render(scene, camera);
}
document.getElementById('snapshot').addEventListener('click', function(){
  renderer.render(scene, camera);
  var a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'warehouse_3d_' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.png';
  a.click();
});
animate();
</script>
